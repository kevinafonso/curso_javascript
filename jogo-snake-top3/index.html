<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <link rel="stylesheet" href="css/style.css?v=3">

    <title>Snake Game</title>
</head>
<body>
    <h1>Use as setas do teclado ou deslize o dedo na tela para jogar.</h1>
    <div class="score">Score: <span class="score-value">00</span></div>
    <div class="menu-screen">
        <span class="game-over">Game Over</span>
        <span class="congrats"></span>
        <span class="final-score">Score <span>00</span></span>

        <div class="name-form">
            <input class="name-input" type="text" maxlength="12" placeholder="Seu nome" autocomplete="off">
            <button class="btn-save">Salvar</button>
        </div>

        <div class="ranking">
            <span class="ranking-title">🏆 Top 25</span>
            <ol class="ranking-list"></ol>
        </div>

        <button class="btn-play">
            <span class="material-symbols-outlined">play_circle</span>
            Jogar Novamente
        </button>
    </div>
    <canvas width="600" height="600"></canvas>
    <script src="js/script.js?v=3"></script>
</body>
</html>
