<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <link rel="stylesheet" href="style.css">
    <title>Mario Jump</title>
</head>
<body>
    <div class="score">Score: <span class="score-value">00</span></div>
    <div class="menu-screen"> <span class="game-over">Game Over</span>
    <span class="final-score">Score <span>00</span></span>

        <button class="btn-play">
            <span class="material-symbols-outlined">
                play_circle
                </span>
                Jogar Novamente
            </button>
</div>
    <div class="game-board">
        <img src="imagens/clouds.png" alt="imagens de nuvems" class="clouds">
        <img src="imagens/mario.gif" alt="imagem mario correndo" class="mario">
        <img src="imagens/pipe.png" alt="imagens canos do mario bross" class="pipe">
    </div>
    <p>Para jogar clique ou use a barra de espaço.</p>
    
</body>

<script src="script.js"></script>

</html>
